<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lisica – 3D demo</title>
<style>
  :root { --panel: rgba(255,255,255,.86); --ink: #3a2a20; --accent: #f2862e; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; font-family: system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; }
  #ui { position: fixed; top: 12px; left: 12px; background: var(--panel); border-radius: 14px; padding: 12px 14px;
        box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 260px; font-size: 13px; }
  #ui h1 { font-size: 16px; margin: 0 0 8px; }
  #anims { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  #anims button { border: 0; border-radius: 999px; padding: 5px 10px; background: #fff; cursor: pointer;
                  box-shadow: 0 1px 3px rgba(0,0,0,.15); font: inherit; color: inherit; }
  #anims button.on { background: var(--accent); color: #fff; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  kbd { background: #fff; border-radius: 4px; padding: 0 4px; box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  #help { line-height: 1.6; margin-top: 6px; }
</style>
</head>
<body>
<div id="ui">
  <h1>🦊 Lisica</h1>
  <div class="row"><label><input type="checkbox" id="play" checked> Način igre (kontrole)</label></div>
  <div id="anims"></div>
  <div id="help">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> hod · <kbd>Shift</kbd> trk<br>
    <kbd>Space</kbd> skok · <kbd>J</kbd> napad · <kbd>C</kbd> sjedi<br>
    <kbd>H</kbd> udarac · <kbd>K</kbd> smrt · <kbd>R</kbd> oživi
  </div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#bfe3f5');
scene.fog = new THREE.Fog('#bfe3f5', 8, 22);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 100);
camera.position.set(1.4, 0.9, 2.0);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.45, 0);
orbit.enableDamping = true;

// soft, warm "animated film" lighting
scene.add(new THREE.HemisphereLight('#fff4e0', '#6b8f4e', 1.4));
const sun = new THREE.DirectionalLight('#fff0dc', 2.6);
sun.position.set(2.5, 4, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
sun.shadow.camera.right = sun.shadow.camera.top = 3;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 4;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight('#cfe8ff', 1.2);
rim.position.set(-2, 2, -3);
scene.add(rim);

// ground + simple scenery
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: '#8cc063', roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(7);
const treeMat = new THREE.MeshStandardMaterial({ color: '#5fa94a', roughness: .9 });
const trunkMat = new THREE.MeshStandardMaterial({ color: '#8a5a3b', roughness: .9 });
const rockMat = new THREE.MeshStandardMaterial({ color: '#b9b2a6', roughness: .9 });
for (let i = 0; i < 40; i++) {
  const a = rnd() * Math.PI * 2, r = 4 + rnd() * 14;
  const g = new THREE.Group();
  if (rnd() < 0.7) {
    const h = 0.8 + rnd() * 0.8;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.07, .1, h, 8), trunkMat);
    trunk.position.y = h / 2;
    const crown = new THREE.Mesh(new THREE.SphereGeometry(0.5 + rnd() * .4, 16, 12), treeMat);
    crown.position.y = h + .35;
    crown.scale.y = 1.2;
    g.add(trunk, crown);
  } else {
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(.2 + rnd() * .3, 1), rockMat);
    rock.position.y = .1; rock.scale.y = .6;
    g.add(rock);
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  scene.add(g);
}

// --- fox -----------------------------------------------------------------
const fox = new THREE.Group();
scene.add(fox);
let mixer, actions = {}, current, locked = false, dead = false;
const LOOP = new Set(['Idle', 'Walk', 'Run', 'Sit']);

new GLTFLoader().load('assets/fox.glb', gltf => {
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  fox.add(model);
  mixer = new THREE.AnimationMixer(model);
  const box = document.getElementById('anims');
  for (const clip of gltf.animations) {
    const a = mixer.clipAction(clip);
    if (!LOOP.has(clip.name)) { a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; }
    actions[clip.name] = a;
    const b = document.createElement('button');
    b.textContent = clip.name;
    b.onclick = () => { dead = false; locked = false; play(clip.name, 0.25, true); };
    box.appendChild(b);
  }
  mixer.addEventListener('finished', e => {
    if (e.action === actions.Death) return;
    locked = false;
    play('Idle', 0.25);
  });
  play('Idle', 0);
  window.__foxReady = true;
});

function play(name, fade = 0.2, force = false) {
  const next = actions[name];
  if (!next || (current === next && !force)) return;
  next.reset().setEffectiveWeight(1).fadeIn(fade).play();
  if (current && current !== next) current.fadeOut(fade);
  current = next;
  document.querySelectorAll('#anims button').forEach(b => b.classList.toggle('on', b.textContent === name));
  if (!LOOP.has(name)) locked = true;
}
window.foxPlay = (n) => { dead = false; locked = false; play(n, 0, true); };
window.__fox = { camera, orbit, get mixer() { return mixer; }, get actions() { return actions; } };

// --- controls --------------------------------------------------------------
const keys = {};
let sitting = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!document.getElementById('play').checked || !mixer) return;
  if (e.code === 'KeyR') { dead = false; locked = false; play('Idle', .3, true); }
  if (dead) return;
  if (e.code === 'Space') { sitting = false; play('Jump', .1, true); }
  if (e.code === 'KeyJ') { sitting = false; play('Attack', .1, true); }
  if (e.code === 'KeyH') { sitting = false; play('Hit', .05, true); }
  if (e.code === 'KeyK') { sitting = false; dead = true; play('Death', .1, true); }
  if (e.code === 'KeyC' && !locked) { sitting = !sitting; play(sitting ? 'Sit' : 'Idle', .4); }
});
addEventListener('keyup', e => keys[e.code] = false);

const clock = new THREE.Clock();
const camOffset = new THREE.Vector3();
let speed = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer) {
    if (document.getElementById('play').checked && !dead) {
      const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
      const s = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
      const moving = f !== 0 || s !== 0;
      const run = keys.ShiftLeft || keys.ShiftRight;
      const target = moving ? (run ? 2.6 : 0.75) : 0;
      speed += (target - speed) * Math.min(1, dt * 8);
      if (moving) {
        sitting = false;
        // move relative to the camera
        const fwd = new THREE.Vector3().subVectors(orbit.target, camera.position).setY(0).normalize();
        const right = new THREE.Vector3().crossVectors(fwd, new THREE.Vector3(0, 1, 0));
        const dir = fwd.multiplyScalar(f).add(right.multiplyScalar(s)).normalize();
        const yaw = Math.atan2(dir.x, dir.z);
        let d = yaw - fox.rotation.y;
        d = Math.atan2(Math.sin(d), Math.cos(d));
        fox.rotation.y += d * Math.min(1, dt * 10);
      }
      const step = new THREE.Vector3(Math.sin(fox.rotation.y), 0, Math.cos(fox.rotation.y)).multiplyScalar(speed * dt);
      fox.position.add(step);
      camera.position.add(step);
      orbit.target.add(step);
      if (!locked) {
        if (speed > 1.6) play('Run', .2);
        else if (speed > 0.08) play('Walk', .25);
        else if (!sitting) play('Idle', .3);
      }
      if (actions.Walk) actions.Walk.timeScale = Math.max(0.6, speed / 0.75);
      if (actions.Run) actions.Run.timeScale = Math.max(0.8, speed / 2.6);
    }
    if (!window.__freeze) mixer.update(dt);
  }
  orbit.update();
  sun.position.copy(fox.position).add(new THREE.Vector3(2.5, 4, 2));
  sun.target.position.copy(fox.position);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
